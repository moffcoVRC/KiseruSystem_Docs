<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">口から手へ取り戻す手順</title><desc id="desc">煙管を持つ側の手を開き、軸のオレンジ色で示す判定範囲に手のひらを重ねてから握る。判定位置は配置画面で調整できる。</desc>
<style>text{font-family:sans-serif;fill:#233f36}.panel{fill:#f7f3e9;stroke:#cbbf9e}.pipe{fill:none;stroke:#765338;stroke-width:9;stroke-linecap:round}.hand{fill:#e5d3b8;stroke:#765338;stroke-width:2}.zone{fill:#efb655;fill-opacity:.3;stroke:#ce8823;stroke-width:2;stroke-dasharray:6 4}</style>
<rect width="960" height="300" fill="#fffdf7"/>
<g transform="translate(12 12)"><rect class="panel" width="300" height="276" rx="14"/><text x="18" y="33" font-size="20">1　持ち手を開く</text><path class="pipe" d="M25 115h240v-20"/><rect class="zone" x="98" y="93" width="100" height="43" rx="21"/><path class="hand" d="M130 239v-49l-11-20q-3-10 6-7l13 15v-43q0-9 7-9t7 9v36-47q0-9 7-9t7 9v46-38q0-9 7-9t7 9v43-28q0-9 7-9t7 9v64l-8 28z"/><text x="18" y="266" font-size="15">右手持ちなら右手、左手なら左手</text></g>
<g transform="translate(330 12)"><rect class="panel" width="300" height="276" rx="14"/><text x="18" y="33" font-size="20">2　軸へ手のひらを重ねる</text><path class="pipe" d="M25 115h240v-20"/><rect class="zone" x="98" y="93" width="100" height="43" rx="21"/><path class="hand" d="M130 170v-49l-11-20q-3-10 6-7l13 15V66q0-9 7-9t7 9v36-47q0-9 7-9t7 9v46-38q0-9 7-9t7 9v43-28q0-9 7-9t7 9v64l-8 28z"/><text x="18" y="230" font-size="15">オレンジは「添え手の判定位置」</text><text x="18" y="253" font-size="15">火皿や吸い口に触れる必要はありません</text></g>
<g transform="translate(648 12)"><rect class="panel" width="300" height="276" rx="14"/><text x="18" y="33" font-size="20">3　重ねたままFistで握る</text><path class="pipe" d="M25 115h240v-20"/><rect class="zone" x="98" y="93" width="100" height="43" rx="21"/><path class="hand" d="M124 166v-54q0-14 12-14h47q16 0 16 15v37l-13 16z"/><path d="M139 100v26m17-26v26m17-26v26" stroke="#765338" stroke-width="2"/><text x="18" y="230" font-size="15">煙管が口から手へ戻ります</text><text x="18" y="253" font-size="15">点火中なら口から煙を吐きます</text></g>
</svg>
